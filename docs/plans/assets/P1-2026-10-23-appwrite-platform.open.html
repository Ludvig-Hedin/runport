<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open plan</title><p>Opening plan...</p><script>
const path="P1-2026-10-23-appwrite-platform.html";
if(location.protocol==="file:")location.replace(path);
else fetch(new URL(path,location.href),{cache:"no-store"}).then(r=>{if(!r.ok)throw Error();return r.text()}).then(html=>{document.open();document.write(html);document.close()}).catch(()=>{document.body.textContent="Could not open the plan. Click its link again to retry."});
</script>
